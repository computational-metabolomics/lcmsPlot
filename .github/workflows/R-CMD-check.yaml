name: R CMD CHECK

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC - full check including vignettes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    container:
      image: bioconductor/bioconductor_docker:3.23

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Bump to discard a poisoned package cache.
      CACHE_VERSION: v1
      # Vignettes and the test suite are only re-run by R CMD check on
      # scheduled and manually dispatched runs.
      FULL_CHECK: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve library path and version key
        id: rinfo
        run: |
          Rscript -e '
            con <- file(Sys.getenv("GITHUB_OUTPUT"), open = "at")
            writeLines(c(paste0("lib=", .libPaths()[1]),
                         paste0("vkey=R", as.character(getRversion()),
                                "-Bioc", as.character(BiocManager::version()))),
                       con)
            close(con)
            message("Library path: ", .libPaths()[1])
          '

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.rinfo.outputs.lib }}
          key: ${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ steps.rinfo.outputs.vkey }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VERSION }}-${{ steps.rinfo.outputs.vkey }}-

      - name: Install system dependencies
        run: |
          apt-get update -y
          apt-get install -y libnetcdf-dev libhdf5-dev

      # A restored cache can hold packages compiled against a different R.
      # They look installed to remotes::install_deps() but fail to load, which
      # is how the "packages are required" failure used to surface 40 minutes in.
      - name: Purge cached packages built under a different R
        run: |
          Rscript -e '
            lib <- .libPaths()[1]
            ip  <- installed.packages(lib.loc = lib)
            if (nrow(ip)) {
              built <- vapply(strsplit(ip[, "Built"], ";", fixed = TRUE),
                              function(x) trimws(sub("R ", "", x[1], fixed = TRUE)),
                              character(1))
              built <- package_version(built, strict = FALSE)
              cur   <- getRversion()
              stale <- rownames(ip)[is.na(built) |
                                    built$major != cur$major |
                                    built$minor != cur$minor]
              if (length(stale)) {
                message("Removing ", length(stale),
                        " package(s) not built under R ", as.character(cur), ": ",
                        paste(stale, collapse = ", "))
                remove.packages(stale, lib = lib)
              } else {
                message("All ", nrow(ip), " cached package(s) match R ",
                        as.character(cur), ".")
              }
            }
          '

      - name: Install R package dependencies
        run: |
          Rscript -e '
            options(Ncpus = max(1L, parallel::detectCores()),
                    repos  = BiocManager::repositories())
            install.packages(c("remotes", "rcmdcheck"))
            remotes::install_deps(".", dependencies = TRUE, upgrade = "never")
          '

      - name: Verify dependencies load
        run: |
          Rscript -e '
            dcf  <- read.dcf("DESCRIPTION")
            cols <- intersect(c("Depends", "Imports"), colnames(dcf))
            pkgs <- unlist(strsplit(paste(dcf[1, cols], collapse = ","), ","))
            pkgs <- trimws(vapply(strsplit(pkgs, "(", fixed = TRUE),
                                  function(x) x[1], character(1)))
            pkgs <- setdiff(pkgs[nzchar(pkgs)], c("R", "NA"))
            bad  <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
            if (length(bad)) {
              stop("Missing or unloadable dependencies: ", paste(bad, collapse = ", "),
                   " -- if these are present on disk the package cache is stale; ",
                   "bump CACHE_VERSION in this workflow.")
            }
            message("All Depends/Imports load cleanly.")
          '

      - name: Run tests
        run: |
          Rscript -e 'testthat::test_local(reporter = "summary", stop_on_failure = TRUE)'

      - name: Run R CMD CHECK
        run: |
          Rscript -e '
            full <- Sys.getenv("FULL_CHECK") == "true"
            # --ignore-vignettes (not --no-vignettes) is required alongside
            # --no-build-vignettes: without inst/doc, the vignette consistency
            # checks warn, and error_on = "warning" would fail the run.
            rcmdcheck::rcmdcheck(
              args       = c("--no-manual", if (!full) c("--ignore-vignettes", "--no-tests")),
              build_args = if (full) character() else "--no-build-vignettes",
              error_on   = "warning")
          '
